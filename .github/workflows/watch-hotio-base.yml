name: Inspect base upstream updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        branch: [workflows, alpinevpn, noblevpn]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare candidate against recorded upstream
        env:
          BRANCH: ${{ matrix.branch }}
        run: python3 tools/prepare_sync.py --target base-image --branch "$BRANCH" --output evidence
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: base-${{ matrix.branch }}-candidate
          path: evidence/
          if-no-files-found: error
          retention-days: 14
