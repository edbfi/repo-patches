name: Prepare hotio refresh
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [base-image, website]
        required: true
      branch:
        type: choice
        options: [workflows, alpinevpn, noblevpn, master]
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare upstream refresh with edbfi customizations
        env:
          TARGET: ${{ inputs.target }}
          BRANCH: ${{ inputs.branch }}
        run: python3 tools/refresh_upstream.py --target "$TARGET" --branch "$BRANCH" --output evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hotio-refresh-${{ inputs.target }}-${{ inputs.branch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
