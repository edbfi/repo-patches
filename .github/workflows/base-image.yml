name: Prepare base-image update
on:
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        options: [workflows, alpinevpn, noblevpn]
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare candidate
        env:
          BRANCH: ${{ inputs.branch }}
        run: python3 tools/prepare_sync.py --target base-image --branch "$BRANCH" --output evidence
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: base-image-candidate
          path: evidence/
          if-no-files-found: error
          retention-days: 14
