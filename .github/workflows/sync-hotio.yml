# SPDX-License-Identifier: AGPL-3.0-only
# Rebuilds edbfi/base-image (workflows, alpinevpn, noblevpn) and edbfi/website
# (master) as Hotio's latest commit plus one github-actions[bot] commit with
# edbfi's adaptations, and force-pushes each changed branch with a lease.
# Started by watch-hotio.yml, or by hand to force a run (empty branches = all).
# The job holds PERSONAL_TOKEN, so it follows edbfi-ci's privileged-job rule
# (design/security.md): inline shell and preinstalled tools only (no actions,
# containers, services or caches), and only on main.
name: Sync Hotio mirrors
on:
  workflow_dispatch:
    inputs:
      branches:
        type: string
        description: Space-separated, empty for all (base-image:workflows base-image:alpinevpn base-image:noblevpn website:master)
        default: ''
      dry_run:
        type: boolean
        description: Build and compare only; never push
        default: false
permissions: {}
concurrency:
  group: sync-hotio
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Require PERSONAL_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          HAS_PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN != '' }}
        run: |
          if [ "$HAS_PERSONAL_TOKEN" != "true" ]; then
            echo "::error::PERSONAL_TOKEN is not set. Add a personal access token with Contents and Workflows read/write on edbfi/base-image and edbfi/website as the Actions secret PERSONAL_TOKEN of edbfi/repo-patches."
            exit 1
          fi
      # This repository is public: an anonymous fetch of the triggering commit
      # needs no credential, and nothing is written to .git/config.
      - name: Fetch this repository at the triggering commit
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Sync
        env:
          BRANCHES: ${{ inputs.branches }}
          DRY_RUN: ${{ inputs.dry_run }}
          # A dry run only reads public repositories; it never gets the token.
          PERSONAL_TOKEN: ${{ !inputs.dry_run && secrets.PERSONAL_TOKEN || '' }}
        run: |
          args=(sync --branches "$BRANCHES" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 tools/mirror.py "${args[@]}"
