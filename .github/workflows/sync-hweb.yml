name: Prepare website update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare candidate
        env:
          BRANCH: master
        run: python3 tools/prepare_sync.py --target website --branch "$BRANCH" --output evidence
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: website-candidate
          path: evidence/
          if-no-files-found: error
          retention-days: 14
